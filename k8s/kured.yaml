# kured (kubereboot/kured) -- rolling node reboot controller.
#
# Replaces manually rebooting each node ~3 minutes apart (which is what
# caused the qha-assignments CronJob DNS failures on 2026-09-17: two
# CoreDNS replicas' nodes were rebooted back to back with nothing checking
# whether CoreDNS had actually recovered in between). kured performs
# cordon -> drain -> reboot -> wait-for-Ready -> uncordon one node at a
# time, using the standard Eviction API for drain -- which means it
# respects PodDisruptionBudgets (see coredns-deployment.yaml's PDB) instead
# of steamrolling through the fleet on a fixed timer.
#
# Signaling (Option A -- explicit sentinel file, not automatic detection):
# kured reboots a node only when /var/run/reboot-required exists on it.
# This is a Debian/unattended-upgrades convention that RHEL does not
# create on its own. Whatever process applies OS/kernel updates on these
# nodes (currently manual, eventually an Ansible playbook/cron job) is
# responsible for running `touch /var/run/reboot-required` at the end of
# a run, and only when something reboot-worthy (kernel, glibc, systemd,
# etc.) actually got installed. kured never deletes this file itself
# (confirmed in its source: the file checker only os.Stat()s it) -- it
# disappears after a successful reboot only because /var/run is tmpfs and
# gets wiped by systemd on every boot, not because kured cleans it up.
# This was chosen over wiring kured's
# --reboot-sentinel-command to `needs-restarting -r` because that command's
# exit-code polarity needs to be verified live against kured's expected
# convention before trusting it unattended -- an explicit, self-authored
# sentinel has no such ambiguity.
#
# RBAC and DaemonSet below are the upstream manifests from
# https://github.com/kubereboot/kured (kured-rbac.yaml + kured-ds.yaml),
# pinned to v1.23.0 (kured publishes no :latest tag by design -- see their
# README FAQ), with one addition: a toleration for the orangepizero3
# dedicated=sdr taint, matching coredns-deployment.yaml, so kured also
# manages that node instead of silently skipping it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kured
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kured
rules:
  # Allow kured to read spec.unschedulable
  # Allow kubectl to drain/uncordon
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete", "get"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kured
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kured
subjects:
  - kind: ServiceAccount
    name: kured
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: kube-system
  name: kured
rules:
  # Allow kured to lock/unlock itself
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["kured"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: kube-system
  name: kured
subjects:
  - kind: ServiceAccount
    namespace: kube-system
    name: kured
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kured
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kured # Must match `--ds-name`
  namespace: kube-system # Must match `--ds-namespace`
spec:
  selector:
    matchLabels:
      name: kured
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: kured
    spec:
      serviceAccountName: kured
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: sdr
          effect: NoSchedule
      hostPID: true # Facilitate entering the host mount namespace via init
      restartPolicy: Always
      volumes:
        - name: sentinel
          hostPath:
            path: /var/run
            type: Directory
      containers:
        - name: kured
          # If you find yourself here wondering why there is no
          # :latest tag on Docker Hub, see the FAQ in the kured README
          image: ghcr.io/kubereboot/kured:1.23.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true # Give permission to nsenter /proc/1/ns/mnt
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: metrics
          env:
            # Pass in the name of the node on which this pod is scheduled
            # for use with drain/uncordon operations and lock acquisition
            - name: KURED_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - mountPath: /sentinel
              name: sentinel
              readOnly: true
          command:
            - /usr/bin/kured
            - --reboot-sentinel=/sentinel/reboot-required
